name: Fuse verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - name: Restore locked development tools
        run: uv sync --locked
      - name: Run configured verification DAG
        id: verify
        shell: bash
        run: |
          run_id="run_$(python -c 'import uuid; print(uuid.uuid4().hex)')"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          uv run --locked python skills/scripts/fuse_verify.py \
            --repo-root "$GITHUB_WORKSPACE" \
            --spec-dir "$GITHUB_WORKSPACE/.specs/001-pstack-integration" \
            --run-id "$run_id"
      - name: Upload candidate-bound check output
        if: always() && steps.verify.outputs.run_id != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuse-checks-${{ steps.verify.outputs.run_id }}
          path: .fuse/runs/${{ steps.verify.outputs.run_id }}/artifacts/checks/
          include-hidden-files: true
          if-no-files-found: ignore
